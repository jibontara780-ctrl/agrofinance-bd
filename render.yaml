services:
  - type: web
    name: agrofinance-bd
    env: node
    plan: free
    buildCommand: npm install && cd server && npm install && cd .. && node client_src/assemble.js
    startCommand: cd server && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
